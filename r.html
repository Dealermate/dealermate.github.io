function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node}
function reportPhotoUrl(value){try{const url=new URL(value);return url.protocol==='https:'&&url.host==='crmeeegayzezeqhgkagx.supabase.co'&&url.pathname.startsWith('/storage/v1/object/sign/')?url.href:''}catch{return ''}}
function openReportFinding(title,text,photos,key){
 const dialog=document.getElementById('reportFindingDialog'),body=document.getElementById('reportFindingBody');body.replaceChildren();document.getElementById('reportFindingTitle').textContent=title||'부위 확인 사진';if(text)body.append(el('p',text));
 const gallery=el('div',undefined,'report-finding-gallery');let count=0;
 for(const photo of (Array.isArray(photos)?photos:[]).slice(0,60)){
  if(key&&photo.partKey!==key)continue;const url=reportPhotoUrl(photo.url);if(!url)continue;
  const button=el('button'),image=el('img');button.type='button';image.src=url;image.alt=String(photo.name||title||'부위 사진');image.referrerPolicy='no-referrer';image.loading='lazy';button.append(image);image.onerror=()=>{button.replaceChildren(el('span','사진을 불러오지 못했습니다. 새 링크를 요청해주세요.'))};button.onclick=()=>{const viewer=document.getElementById('reportPhotoViewer');document.getElementById('reportLargePhoto').src=url;document.getElementById('reportLargePhoto').alt=image.alt;if(!viewer.open)viewer.showModal()};gallery.append(button);count++;

function drawDiagram(data,photos=[]){
 const accident=data.kind==='accident',box=el('div',undefined,'diagram'+(accident?' accident':'')),plane=el('div',undefined,'diagram-plane'),image=el('img');box.append(plane);image.src=accident?'https://i.imgur.com/agbd7Z8.png':'https://i.imgur.com/1OGXwOu.png';image.alt=accident?'교환·판금 및 도막측정 도면':'도색 선택 부위 도면';plane.append(image);
 for(const p of (Array.isArray(data.points)?data.points:[]).slice(0,100)){
  const top=Number(p.top),left=Number(p.left);if(!Number.isFinite(top)||!Number.isFinite(left)||top<0||top>100||left<0||left>100)continue;
  const mark=['R','X','W','XX','WW'].includes(p.mark)?p.mark:'';
  const position=node=>{node.style.top=top+'%';node.style.left=left+'%';node.title=String(p.title||'부위');plane.append(node)};
  if(mark){const button=el('button',mark,'mark'+(mark.includes('X')||!accident?' red':''));button.type='button';button.setAttribute('aria-label',String(p.title||'부위')+' 사진 보기');button.onclick=()=>openReportFinding(p.title,'',photos,p.key||'');position(button)}
  if(typeof p.value==='number'&&Number.isFinite(p.value)&&p.value>=0&&p.value<=100000)position(el('span',p.value+' μm','value'+(p.value>=300?' high':'')+(mark?' with-mark':'')));
 }

}
async function decodeReport(){
 const token=new URLSearchParams(location.hash.slice(1)).get('r')||'';if(token.length>30000||!/^([jd])\.[A-Za-z0-9_-]+$/.test(token))throw Error('올바른 리포트 링크가 아닙니다.');
 const format=token[0],bytes=Uint8Array.from(atob(token.slice(2).replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
 let stream=new Blob([bytes]).stream();if(format==='d'){if(typeof DecompressionStream!=='function')throw Error('이 브라우저에서 리포트를 열 수 없습니다. 최신 Chrome으로 열어주세요.');stream=stream.pipeThrough(new DecompressionStream('deflate'))}
 const reader=stream.getReader(),chunks=[];let length=0;
 try{while(true){const {value,done}=await reader.read();if(done)break;length+=value.length;if(length>200000){await reader.cancel();throw Error('리포트 크기가 너무 큽니다.')}chunks.push(value)}}finally{reader.releaseLock()}
 const raw=new Uint8Array(length);let offset=0;for(const chunk of chunks){raw.set(chunk,offset);offset+=chunk.length}
 const report=JSON.parse(new TextDecoder().decode(raw));if(report.version!==1||!Array.isArray(report.sections)||report.sections.length>20)throw Error('지원하지 않는 리포트입니다.');
 return report;
}
function showReport(report){
 const meta=document.getElementById('meta'),content=document.getElementById('content'),tabs=document.getElementById('tabs'),sections=[],buttons=[];
 const date=new Date(report.created);meta.textContent=String(report.carNumber||'차량')+' · '+(Number.isFinite(date.getTime())?date.toLocaleString('ko-KR'):'')+' · 입찰가 '+String(report.bidPrice||'0')+'원';
 let count=0;
 report.sections.forEach((item,index)=>{
  const section=el('section'),title=String(item.title||'검차 내역').slice(0,100);section.append(el('h2',title));
  for(const row of (Array.isArray(item.rows)?item.rows:[]).slice(0,1000)){
   if(++count>3000)throw Error('리포트 항목이 너무 많습니다.');
   if(row.diagram){section.append(drawDiagram(row.diagram,row.photos));continue}
   if(typeof row.text==='string'){const paragraph=el('p',undefined,row.strong?'strong':'');if(row.partKey){const button=el('button',row.text.slice(0,20000)+' · 사진 보기','finding-link');button.type='button';button.onclick=()=>openReportFinding(row.text.slice(0,100),'',row.photos,row.partKey);paragraph.append(button)}else paragraph.textContent=row.text.slice(0,20000);section.append(paragraph);}
  }
  sections.push(section);content.append(section);const button=el('button',title);button.onclick=()=>select(index);tabs.append(button);buttons.push(button);
 });
 if(!sections.length)throw Error('리포트 내용이 없습니다.');
 let page=0;function select(index){page=Math.max(0,Math.min(sections.length-1,index));sections.forEach((section,i)=>section.hidden=i!==page);buttons.forEach((button,i)=>button.setAttribute('aria-current',i===page?'step':'false'));document.getElementById('previous').disabled=page===0;document.getElementById('next').disabled=page===sections.length-1;document.getElementById('pageCount').textContent=(page+1)+' / '+sections.length}
 document.getElementById('previous').onclick=()=>select(page-1);document.getElementById('next').onclick=()=>select(page+1);
 document.getElementById('status').hidden=true;tabs.hidden=false;document.getElementById('pager').hidden=false;select(0);
}

async function loadPurchaseReport(){

 if(token===null)return decodeReport(); // Existing compressed links remain readable.

 if(!response.ok)throw Error('리포트를 불러오지 못했습니다. 잠시 후 다시 열어주세요.');

 purchaseReportExpiry=new Date(data.expiresAt).getTime();

 setTimeout(()=>unavailablePurchaseReport('리포트 열람 기간이 종료됐습니다.'),Math.min(purchaseReportExpiry-Date.now(),2147483647));

document.addEventListener('visibilitychange',()=>{if(purchaseReportExpiry&&Date.now()>=purchaseReportExpiry)unavailablePurchaseReport('리포트 열람 기간이 종료됐습니다.')});
